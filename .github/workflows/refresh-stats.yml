name: Refresh stats data

# Real NFL stats (scores, EPA, standings, roster grades, opponent matchups)
# only change when games have actually been played — the entire league's
# games, not just the Patriots', since opponent data depends on it too.
# Rather than rebuild on a blind timer, this runs on a schedule aimed at
# "shortly after games typically finish": once daily (catches Thursday
# Night Football and Monday Night Football the next morning, and doubles
# as a catch-all for exceptions like season openers, Thanksgiving, or
# other odd-day games within ~24 hours), plus extra same-day passes around
# the Sunday slate so it doesn't sit stale until the daily catch-all.
# workflow_dispatch covers any exception that needs updating sooner than
# that.
#
# The 5pm ET Sunday and 1am ET Monday passes update scores/standings
# promptly, but nflverse's play-by-play CSV (the source for every EPA
# stat) isn't fully finalized that fast — confirmed directly against
# nflverse's GitHub release timestamps, a full Sunday slate wasn't
# finalized until ~11:54am ET the following Monday, well after both of
# those runs. That's why EPA rankings could look "half updated" (scores
# current, some teams' EPA stale) right after a Sunday. The 1pm ET Monday
# pass exists specifically to catch that finalized file once it's ready.
#
# Times are UTC and tuned for Eastern Time (ET); they drift an hour
# relative to ET across the fall DST change, which only shifts "shortly
# after games end" earlier or later by an hour — harmless for this purpose.

on:
  schedule:
    - cron: "0 9 * * *" # ~5am ET daily — catches TNF (Fri) and MNF (Tue), and any exception day within ~24h
    - cron: "0 21 * * 0" # ~5pm ET Sunday — after the early Sunday games, before late/SNF
    - cron: "0 5 * * 1" # ~1am ET Monday — after the Sunday slate (including SNF) wraps (scores/standings; EPA may still be pending nflverse finalization)
    - cron: "0 17 * * 1" # ~1pm ET Monday — catches nflverse's play-by-play finalization lag, so EPA stats catch up to the scores from the ~1am run
  workflow_dispatch: {} # manual "Run workflow" button, for on-demand refreshes

permissions:
  contents: write

concurrency:
  group: refresh-stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Fetch nflverse data (schedule, play-by-play, rosters, injuries)
        run: npx tsx scripts/fetch-nflverse.ts
        continue-on-error: true

      - name: Fetch ESPN scoreboard (odds, used by opponent matchup)
        run: npx tsx scripts/fetch-news-sources.ts
        continue-on-error: true

      - name: Build core stats (schedule, team stats, recap, standings)
        run: npx tsx scripts/build-data.ts
        continue-on-error: true

      - name: Build league-wide data (all divisions, EPA power rankings, last week's scores)
        run: npx tsx scripts/build-league-data.ts
        continue-on-error: true

      - name: Build roster data (depth chart, QB deep dive, position grades)
        run: npx tsx scripts/build-roster-data.ts
        continue-on-error: true

      - name: Build opponent matchup data
        run: npx tsx scripts/build-next-game-data.ts
        continue-on-error: true

      - name: Generate AI recap take, good/bad/ugly, and next-game preview
        run: npx tsx scripts/build-ai-recap.ts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        continue-on-error: true

      - name: Commit and push if data changed
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git status --porcelain -- data/generated | grep -q .; then
            git add data/generated
            git commit -m "Automated stats refresh $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin main
            git push
          else
            echo "No data changes this run — nothing to commit."
          fi
