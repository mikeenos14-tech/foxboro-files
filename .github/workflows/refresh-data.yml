name: Refresh site data

# Runs the exact same pipeline scripts used locally throughout development,
# on a schedule, using GitHub Actions' own (free, normal-filesystem) runner
# instead of Vercel's serverless functions — Vercel's production filesystem
# is ephemeral/read-only outside /tmp, so a Vercel Cron route can't just
# write data/generated/*.json the way these scripts do locally. Committing
# the refreshed JSON back to main is what triggers Vercel's existing
# GitHub-integration auto-deploy, so "refresh data" and "redeploy the site"
# stay one step from this workflow's point of view.
#
# No secrets required: every source here (nflverse, ESPN's public
# endpoints, patriots.com's RSS feed) is free and keyless. Pushing back to
# this same repo uses the token GitHub provides to every Actions run
# automatically.
#
# Each script is its own step with continue-on-error, and the commit step
# runs regardless (if: always()) — every script already fails soft on its
# own (keeps last-good output rather than overwriting with something
# broken), so one source having a bad moment shouldn't also throw away
# whatever the OTHER scripts successfully refreshed this run.

on:
  schedule:
    # Every 3 hours, all day — keeps stats, injuries, odds, and headlines
    # fresh without hammering any of the free sources this depends on.
    - cron: "0 */3 * * *"
  workflow_dispatch: {} # manual "Run workflow" button, for on-demand refreshes

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Fetch nflverse data (schedule, play-by-play, rosters, injuries)
        run: npx tsx scripts/fetch-nflverse.ts
        continue-on-error: true

      - name: Build core stats (schedule, team stats, recap, standings)
        run: npx tsx scripts/build-data.ts
        continue-on-error: true

      - name: Build roster data (depth chart, QB deep dive, position grades)
        run: npx tsx scripts/build-roster-data.ts
        continue-on-error: true

      - name: Fetch news sources (ESPN, official RSS, scoreboard odds)
        run: npx tsx scripts/fetch-news-sources.ts
        continue-on-error: true

      - name: Build opponent matchup data
        run: npx tsx scripts/build-next-game-data.ts
        continue-on-error: true

      - name: Build news and injury reports
        run: npx tsx scripts/build-espn-data.ts
        continue-on-error: true

      - name: Commit and push if data changed
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git status --porcelain -- data/generated | grep -q .; then
            git add data/generated
            git commit -m "Automated data refresh $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          else
            echo "No data changes this run — nothing to commit."
          fi
